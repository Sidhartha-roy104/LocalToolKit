<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LocalToolkit — all file tools in one place. 100% offline. No uploads. No account required.">
  <meta name="robots" content="noindex, nofollow">
  <title>LocalToolkit — All File Tools in One Place</title>

  <!-- Favicon inline SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Crect x='7' y='8' width='12' height='3' rx='1' fill='white'/%3E%3Crect x='7' y='13' width='8' height='3' rx='1' fill='white'/%3E%3Crect x='7' y='18' width='10' height='3' rx='1' fill='white'/%3E%3Ccircle cx='23' cy='21' r='5' fill='%23FCD34D'/%3E%3C/svg%3E">

  <!-- Stylesheets — local only, no CDN -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">

  <!-- Preload font -->
  <link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin="anonymous">
</head>
<body>
  <!-- Skip link for keyboard users -->
  <a class="skip-link" href="#main-content">Skip to content</a>

  <!-- Navbar -->
  <header>
    <nav class="navbar" id="navbar" aria-label="Site navigation"></nav>
  </header>

  <!-- Main -->
  <main id="main-content">
    <!-- Home view -->
    <div id="home-view"></div>

    <!-- Tool view (SPA, no reload) -->
    <div id="tool-view" style="display:none" aria-label="Tool workspace"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer__privacy">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path stroke-linecap="round" d="M8 11V7a4 4 0 018 0v4"/>
        </svg>
        100% Offline. Your files never leave this device.
      </div>
      <div class="footer__links">
        <a href="#/privacy">Privacy</a>
        <a href="#/about">About</a>
        <a href="/api/docs" target="_blank" rel="noopener">API Docs</a>
        <a href="/api/health" id="status-link" target="_blank" rel="noopener">System Status</a>
      </div>
    </div>
  </footer>

  <!-- Toast container (ARIA live region) -->
  <div id="toast-container" aria-label="Notifications" role="region"></div>

  <!-- App entry point — ES modules, no bundler needed -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
